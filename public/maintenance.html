
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Website Sedang Pemeliharaan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #14532d;
    }
    main {
      max-width: 560px;
      padding: 36px 28px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 32px #14532d18;
    }
    .icon { font-size: 52px; }
    h1 { font-size: 27px; }
    p {
      color: #4b5563;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">🛠️</div>
    <h1>Website Sedang Pemeliharaan</h1>
    <p>
      Mohon maaf, website kami sedang menjalani
      pemeliharaan sementara.
    </p>
    <p>
      Silakan kunjungi kembali beberapa saat lagi.
      Terima kasih atas pengertian Anda.
    </p>
  </main>
</body>
</html>
